<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <defs>
    <filter id="embossed-paper" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.035" numOctaves="3" seed="27" result="height"/>
      <feDiffuseLighting in="height" surfaceScale="4" diffuseConstant="0.7" lighting-color="#fff8e9" result="light">
        <feDistantLight azimuth="225" elevation="48"/>
